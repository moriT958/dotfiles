# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  fmt:
    desc: Format nvim Lua files
    cmds:
      - stylua dot_config/nvim

  lint:
    desc: Lint nvim Lua files
    cmds:
      - stylua --check dot_config/nvim
      - luacheck dot_config/nvim
      - lua-language-server --check dot_config/nvim --configpath "$PWD/.luarc.json"
