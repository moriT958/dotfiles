# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  fmt:
    desc: Format nvim Lua files
    dir: dot_config/nvim
    cmds:
      - stylua .

  lint:
    desc: Lint nvim Lua files
    dir: dot_config/nvim
    cmds:
      # chezmoi の source 側では dot_ 名になっているため、設定ファイルを明示する
      - stylua --check .
      - luacheck --config dot_luacheckrc .
      - lua-language-server --check . --configpath dot_luarc.json
