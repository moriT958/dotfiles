[settings]
npm.package_manager = "pnpm"

[tools]
# Common
tree-sitter = "latest"

# C
clang-format = "latest"

# Typst
tinymist = "latest"

# Node
node = "lts"
pnpm = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:prettier" = "latest"

# Lua
lua = "5.4"
lua-language-server = "latest"
stylua = "latest"

# Go 
go = "latest"
"go:golang.org/x/tools/cmd/godoc" = "latest"
"go:github.com/golangci/golangci-lint/cmd/golangci-lint" = "latest"
"go:golang.org/x/tools/gopls" = "latest"

# Ruby
ruby = "latest"
"gem:ruby-lsp" = "latest"

# Python
uv = "latest"

# Rust
rust = "latest"

# Zig
zig = "0.16.0"
zls = "0.16.0"


# Bun
bun = "1.4.4"
